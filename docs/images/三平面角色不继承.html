  <title id="t2">Three non-inheriting role planes</title>

  <text x="135" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">user_role</text>
  <rect x="56" y="104" width="158" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="135" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#26215C">proxy_admin</text>
  <rect x="56" y="154" width="158" height="40" rx="8" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>

  <rect x="56" y="204" width="158" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="135" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#26215C">internal_user</text>

  <text x="135" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">org_admin string only</text>

  <text x="56" y="342" font-family="sans-serif" font-size="12" fill="#534AB7">team / customer JWT</text>

  <text x="340" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#04342C">internal_user</text>
  <rect x="261" y="204" width="158" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">internal_user_viewer</text>
