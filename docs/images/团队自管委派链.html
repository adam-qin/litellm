<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" role="img" aria-labelledby="t3 d3">
  <title id="t3">Delegated team self-management chain</title>
  <desc id="d3">Proxy Admin creates the org, Org Admin creates the team and assigns Team Admin, Team Admin then manages members keys and team-scoped models without further platform tickets.</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="140" height="88" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="110" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489">Proxy Admin</text>
  <text x="110" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">create org</text>
  <text x="110" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">assign org_admin</text>
  <line x1="180" y1="84" x2="218" y2="84" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow3)"/>
  <rect x="220" y="40" width="140" height="88" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="290" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">Org Admin</text>
  <text x="290" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">create team</text>
  <text x="290" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">assign team admin</text>
  <line x1="360" y1="84" x2="398" y2="84" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow3)"/>
  <rect x="400" y="40" width="140" height="88" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="470" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">Team Admin</text>
  <text x="470" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">members / keys</text>
  <text x="470" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">team models</text>
  <line x1="540" y1="84" x2="578" y2="84" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow3)"/>
  <rect x="580" y="40" width="80" height="88" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="620" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">user</text>
  <text x="620" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">own keys</text>
  <rect x="40" y="160" width="600" height="164" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="188" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">After step 3 the platform stays out</text>
  <text x="56" y="216" font-family="sans-serif" font-size="13" fill="#185FA5">1. /team/member_add role=user</text>
  <text x="56" y="240" font-family="sans-serif" font-size="13" fill="#185FA5">2. /team/update team_member_permissions</text>
  <text x="56" y="264" font-family="sans-serif" font-size="13" fill="#185FA5">3. /model/new model_info.team_id = this team</text>
  <text x="56" y="288" font-family="sans-serif" font-size="13" fill="#185FA5">4. /key/service-account/generate for production traffic</text>
  <text x="56" y="312" font-family="sans-serif" font-size="12" fill="#185FA5">Raising max_budget still needs Proxy Admin. Org-scoped teams also stay inside org budget.</text>
</svg>
