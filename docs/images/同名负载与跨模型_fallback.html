<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" role="img" aria-labelledby="t3 d3">
  <title id="t3">Same-name load balancing versus cross-model fallback</title>
  <desc id="d3">Multiple deployments sharing one public model name are intra-group LB. Fallback only switches different model names.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text class="th" x="40" y="32" fill="var(--color-text-primary)">Same public name is LB, not fallback</text>
  <rect x="40" y="52" width="290" height="180" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="185" y="78" text-anchor="middle" fill="#0C447C">model_name gpt-5.4</text>
  <rect x="60" y="96" width="250" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="185" y="114" text-anchor="middle" fill="#0C447C">Qiniu credentials</text>
  <rect x="60" y="140" width="250" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="185" y="158" text-anchor="middle" fill="#0C447C">Fenno credentials</text>
  <rect x="60" y="184" width="250" height="32" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="185" y="200" text-anchor="middle" fill="#042C53">simple-shuffle or cost-based</text>
  <rect x="350" y="52" width="290" height="180" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="495" y="78" text-anchor="middle" fill="#633806">fallbacks across names</text>
  <rect x="370" y="96" width="250" height="36" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="495" y="114" text-anchor="middle" fill="#633806">gpt-5.4 fails retries</text>
  <rect x="370" y="140" width="250" height="36" rx="8" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="495" y="158" text-anchor="middle" fill="#412402">then gpt-5.4-mini</text>
  <rect x="370" y="184" width="250" height="32" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="495" y="200" text-anchor="middle" fill="#854F0B">same name skipped in chain</text>
  <rect x="40" y="256" width="600" height="200" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="56" y="284" fill="#27500A">Failure order inside Router</text>
  <text class="ts" x="56" y="312" fill="#3B6D11">1. num_retries on the picked deployment</text>
  <text class="ts" x="56" y="336" fill="#3B6D11">2. allowed_fails then cooldown_time removes a bad node</text>
  <text class="ts" x="56" y="360" fill="#3B6D11">3. optional order or weighted failover still same model name</text>
  <text class="ts" x="56" y="384" fill="#3B6D11">4. context_window / content_policy special chains</text>
  <text class="ts" x="56" y="408" fill="#3B6D11">5. general fallbacks switch a different public model name</text>
  <text class="ts" x="56" y="432" fill="#3B6D11">Need Redis so cooldown and rpm are shared across slaves</text>
</svg>
