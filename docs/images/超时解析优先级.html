<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img" aria-labelledby="t-timeout d-timeout">
  <title id="t-timeout">Timeout resolution order on xhub-qiniu</title>
  <desc id="d-timeout">Per-attempt timeout is resolved in order: request, deployment, litellm_settings.request_timeout, then router_settings.timeout 120s. This is not a chain budget.</desc>
  <defs>
    <marker id="arrow-timeout" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="36" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Per-attempt timeout, not a chain budget</text>
  <text x="40" y="56" font-family="sans-serif" font-size="12" fill="#185FA5">_get_non_stream_timeout() / _get_stream_timeout() on each hop</text>
  <rect x="40" y="80" width="600" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">1. Request timeout / request_timeout</text>
  <text x="340" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Client payload. Highest priority, sticky on later hops</text>
  <line x1="340" y1="132" x2="340" y2="158" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow-timeout)"/>
  <rect x="40" y="160" width="600" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">2. Deployment litellm_params.timeout</text>
  <text x="340" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Per-model. Only used if kwargs has no timeout yet</text>
  <line x1="340" y1="212" x2="340" y2="238" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow-timeout)"/>
  <rect x="40" y="240" width="600" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">3. litellm_settings.request_timeout</text>
  <text x="340" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Only if router timeout is also set</text>
  <line x1="340" y1="292" x2="340" y2="318" stroke="#854F0B" stroke-width="1.5" fill="none" marker-end="url(#arrow-timeout)"/>
  <rect x="40" y="320" width="600" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">4. Dashboard router_settings.timeout = 120s</text>
  <text x="340" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Default for every hop that has no higher timeout</text>
</svg>
